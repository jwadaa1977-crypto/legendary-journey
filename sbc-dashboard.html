<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SBC – SMART BOX CONTROL</title>
<style>
:root{
  --bg:#0b0f17; --card:#141a24; --card2:#1a212d; --text:#e7eaf0; --muted:#8891a3;
  --accent:#22d3ee; --amber:#fcd34d; --green:#34d399; --red:#f87171; --border:#232b3a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 60px;}
header{position:sticky;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,rgba(11,15,23,.97),rgba(11,15,23,.85));backdrop-filter:blur(6px);z-index:10;padding-bottom:12px;border-bottom:1px solid var(--border);}
.h-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.h-title{font-size:1.15em;font-weight:800;letter-spacing:.3px;}
.h-tag{color:var(--muted);font-size:.78em;margin-top:2px;}
.icon-btn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;font-size:1.1em;cursor:pointer;}
.mode-banner{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:.82em;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.mode-demo{background:color-mix(in srgb, var(--amber) 14%, transparent);border:1px solid color-mix(in srgb, var(--amber) 35%, transparent);color:var(--amber);}
.mode-real{background:color-mix(in srgb, var(--green) 14%, transparent);border:1px solid color-mix(in srgb, var(--green) 35%, transparent);color:var(--green);}
.toggle-mode{background:none;border:1px solid currentColor;border-radius:8px;padding:3px 9px;color:inherit;font-size:.85em;cursor:pointer;}
.quick{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;}
.qbtn{flex:0 0 auto;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 14px;font-size:.85em;white-space:nowrap;cursor:pointer;}
.qbtn:active{transform:scale(.97);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:9px;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.15s;}
.card.on{border-color:color-mix(in srgb, var(--accent) 45%, var(--border));box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent) inset;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;}
.dev-icon{font-size:1.5em;}
.dev-icon.on{filter:drop-shadow(0 0 6px currentColor);}
.sw{width:44px;height:25px;border-radius:20px;background:#2a3242;position:relative;border:none;cursor:pointer;flex:0 0 auto;}
.sw.on{background:var(--accent);}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;}
.sw.on::after{transform:translateX(-19px);}
.dev-name{font-weight:700;font-size:.92em;}
.dev-room{color:var(--muted);font-size:.75em;}
.dev-state{font-size:.72em;padding:3px 8px;border-radius:6px;align-self:flex-start;}
.state-on{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green);}
.state-off{background:color-mix(in srgb, var(--muted) 18%, transparent);color:var(--muted);}
.state-offline{background:color-mix(in srgb, var(--red) 18%, transparent);color:var(--red);}
h2.section{font-size:.95em;color:var(--muted);margin:20px 4px 8px;font-weight:700;}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;background:var(--accent);color:#07131a;border:none;border-radius:50%;width:52px;height:52px;font-size:1.6em;box-shadow:0 6px 18px rgba(34,211,238,.4);cursor:pointer;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-top-right-radius:18px;border-top-left-radius:18px;padding:18px;width:100%;max-height:85vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
.modal h3{margin-top:0;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:.82em;color:var(--muted);margin-bottom:5px;}
.field input,.field select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 10px;font-size:.9em;}
.btn-primary{background:var(--accent);color:#07131a;border:none;border-radius:10px;padding:11px;width:100%;font-weight:700;font-size:.92em;cursor:pointer;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;width:100%;font-size:.9em;margin-top:8px;cursor:pointer;}
.lang-row{display:flex;gap:8px;}
.lang-row button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;}
.lang-row button.active{background:var(--accent);color:#07131a;border-color:var(--accent);}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:.85em;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="h-row">
      <div>
        <div class="h-title">🤖 SBC – SMART BOX CONTROL</div>
        <div class="h-tag" id="tagline">تحكم ذكي • أتمتة ذكية • أمان ذكي • طاقة ذكية</div>
      </div>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
    <div class="mode-banner" id="modeBanner"></div>
    <div class="quick" id="quickActions"></div>
  </header>

  <h2 class="section" id="devicesLabel">الأجهزة</h2>
  <div class="grid" id="deviceGrid"></div>
  <div id="emptyState" class="empty" style="display:none">ما كايناش أجهزة. ضيف واحد بزر ➕</div>
</div>

<button class="fab" onclick="openAddDevice()">＋</button>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ الإعدادات</h3>
    <div class="field">
      <label>اللغة</label>
      <div class="lang-row">
        <button onclick="setLang('ar')" id="langAr">عربية</button>
        <button onclick="setLang('fr')" id="langFr">Français</button>
        <button onclick="setLang('en')" id="langEn">English</button>
      </div>
    </div>
    <div class="field">
      <label>الوضع</label>
      <div class="lang-row">
        <button onclick="setMode('DEMO')" id="modeDemoBtn">تجريبي DEMO</button>
        <button onclick="setMode('REAL')" id="modeRealBtn">حقيقي REAL</button>
      </div>
    </div>
    <button class="btn-ghost" onclick="closeModal('settingsModal')">إغلاق</button>
  </div>
</div>

<div class="modal-bg" id="addModal">
  <div class="modal">
    <h3>➕ إضافة جهاز</h3>
    <div class="field"><label>الاسم</label><input id="newName" placeholder="مثال: نور الصالون"></div>
    <div class="field"><label>الغرفة</label><input id="newRoom" placeholder="مثال: الصالون"></div>
    <div class="field"><label>النوع</label>
      <select id="newType">
        <option value="LIGHT">💡 إنارة</option>
        <option value="PLUG">🔌 مقبس</option>
        <option value="AC">❄️ مكيف</option>
        <option value="GATE">🚪 بوابة</option>
        <option value="PUMP">💧 مضخة</option>
        <option value="CURTAIN">🪟 ستارة</option>
      </select>
    </div>
    <button class="btn-primary" onclick="addDevice()">إضافة</button>
    <button class="btn-ghost" onclick="closeModal('addModal')">إلغاء</button>
  </div>
</div>

<script>
const ICONS={LIGHT:'💡',PLUG:'🔌',AC:'❄️',GATE:'🚪',PUMP:'💧',CURTAIN:'🪟',RELAY:'🔗',IRRIGATION:'🌱',SENSOR:'📡',ENERGY_METER:'⚡',OTHER:'🔧'};
const T={
  ar:{devices:'الأجهزة',demo:'وضع المحاكاة / تجريبي',real:'وضع الهاردوير الحقيقي',all_on:'تشغيل الكل',all_off:'إطفاء الكل',tagline:'تحكم ذكي • أتمتة ذكية • أمان ذكي • طاقة ذكية',on:'مُشغّل',off:'مُطفأ',offline:'غير متصل'},
  fr:{devices:'Appareils',demo:'Mode démo',real:'Mode réel',all_on:'Tout allumer',all_off:'Tout éteindre',tagline:'Contrôle intelligent • Automatisation • Sécurité • Énergie',on:'Allumé',off:'Éteint',offline:'Hors ligne'},
  en:{devices:'Devices',demo:'Demo mode',real:'Real mode',all_on:'All ON',all_off:'All OFF',tagline:'Smart control • Automation • Security • Energy',on:'On',off:'Off',offline:'Offline'}
};
let state=JSON.parse(localStorage.getItem('sbc_state')||'null')||{
  lang:'ar',mode:'DEMO',
  devices:[
    {id:'d1',name:'نور الصالون',room:'الصالون',type:'LIGHT',state:'ON'},
    {id:'d2',name:'مقبس التلفاز',room:'الصالون',type:'PLUG',state:'OFF'},
    {id:'d3',name:'بوابة الكراج',room:'الكراج',type:'GATE',state:'OFF'},
    {id:'d4',name:'مضخة الماء',room:'الحديقة',type:'PUMP',state:'OFFLINE'}
  ]
};
function save(){localStorage.setItem('sbc_state',JSON.stringify(state));}
function t(){return T[state.lang]||T.ar;}

function render(){
  document.documentElement.dir = state.lang==='ar'?'rtl':'ltr';
  document.getElementById('tagline').textContent=t().tagline;
  document.getElementById('devicesLabel').textContent=t().devices;
  const mb=document.getElementById('modeBanner');
  mb.className='mode-banner '+(state.mode==='DEMO'?'mode-demo':'mode-real');
  mb.innerHTML=`<span>${state.mode==='DEMO'?'🧪 '+t().demo:'🟢 '+t().real}</span><button class="toggle-mode" onclick="setMode('${state.mode==='DEMO'?'REAL':'DEMO'}')">${state.mode==='DEMO'?'→ REAL':'→ DEMO'}</button>`;

  document.getElementById('quickActions').innerHTML=`
    <button class="qbtn" onclick="setAll('ON')">🟢 ${t().all_on}</button>
    <button class="qbtn" onclick="setAll('OFF')">⚪ ${t().all_off}</button>`;

  const grid=document.getElementById('deviceGrid');
  const empty=document.getElementById('emptyState');
  if(!state.devices.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  grid.innerHTML=state.devices.map(d=>{
    const on=d.state==='ON';
    const off=d.state==='OFFLINE';
    const stateClass=off?'state-offline':(on?'state-on':'state-off');
    const stateLabel=off?t().offline:(on?t().on:t().off);
    return `<div class="card ${on?'on':''}">
      <div class="card-top">
        <div class="dev-icon ${on?'on':''}">${ICONS[d.type]||'🔧'}</div>
        <button class="sw ${on?'on':''}" ${off?'disabled style="opacity:.4"':''} onclick="toggle('${d.id}')"></button>
      </div>
      <div class="dev-name">${d.name}</div>
      <div class="dev-room">${d.room}</div>
      <div class="dev-state ${stateClass}">${stateLabel}</div>
    </div>`;
  }).join('');
}
function toggle(id){
  const d=state.devices.find(x=>x.id===id);
  if(!d||d.state==='OFFLINE')return;
  d.state=d.state==='ON'?'OFF':'ON';
  save();render();
}
function setAll(s){state.devices.forEach(d=>{if(d.state!=='OFFLINE')d.state=s;});save();render();}
function setLang(l){state.lang=l;save();render();syncSettingsUI();}
function setMode(m){state.mode=m;save();render();syncSettingsUI();}
function syncSettingsUI(){
  ['Ar','Fr','En'].forEach(k=>document.getElementById('lang'+k).classList.remove('active'));
  document.getElementById('lang'+state.lang[0].toUpperCase()+state.lang.slice(1)).classList.add('active');
  document.getElementById('modeDemoBtn').classList.toggle('active',state.mode==='DEMO');
  document.getElementById('modeRealBtn').classList.toggle('active',state.mode==='REAL');
}
function openSettings(){document.getElementById('settingsModal').classList.add('show');syncSettingsUI();}
function openAddDevice(){document.getElementById('addModal').classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function addDevice(){
  const name=document.getElementById('newName').value.trim();
  const room=document.getElementById('newRoom').value.trim();
  const type=document.getElementById('newType').value;
  if(!name)return;
  state.devices.push({id:'d'+Date.now(),name,room:room||'-',type,state:'OFF'});
  save();render();closeModal('addModal');
  document.getElementById('newName').value='';document.getElementById('newRoom').value='';
}
render();
</script>
</body>
</html>
